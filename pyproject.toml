[project]
name = "codex-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.111.0",
    "black>=26.3.1",
    "chromadb>=1.5.8",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "google-genai>=1.73.1",
    "json-repair>=0.61.0",
    "ollama>=0.6.1",
    "pre-commit>=4.6.0",
    "pyautogui>=0.9.54",
    "pytest>=9.0.3",
    "pytest-watch>=4.2.0",
    "pywin32>=311 ; sys_platform == 'win32'",
    "ruff>=0.15.12",
    "sentence-transformers>=5.4.1",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]


[tool.pyright]
  pythonVersion = "3.14"
  typeCheckingMode = "basic"
  include = ["app"]
